name: Fork release

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fork-release.yml"
      - ".github/upstream-version"
    tags:
      - "v*"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "指定要同步并构建的上游版本（例如 v0.89.0 或 v1.0.0-preview.136）；留空则使用最新上游发布（含预览版）"
        required: false
        type: string
      force_build:
        description: "即使已同步或已发布也重新构建（使用新的 fork 标签，不覆盖已有版本）"
        required: false
        default: true
        type: boolean

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-upstream:
    name: Sync upstream release
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.sync.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Test fork release decisions
        run: python3 tests/test_fork_release.py -v

      - name: Rebase custom commits onto latest upstream release
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_UPSTREAM_TAG: ${{ github.event.inputs.upstream_tag || '' }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
        run: |
          set -euo pipefail
          current_upstream="$(cat .github/upstream-version)"
          latest_upstream="${REQUESTED_UPSTREAM_TAG:-}"
          if [ -z "$latest_upstream" ]; then
            # --slurp 把全部分页汇总为一个外层数组（gh 不允许与 --jq 同用），
            # 再由 Python 统一取 published_at 最新者：包含 prerelease、排除 draft，
            # 不依赖 API 返回顺序或第一页。
            latest_upstream="$(gh api repos/1jehuang/jcode/releases --paginate --slurp | python3 -c '
          import json
          import sys

          pages = json.load(sys.stdin)
          releases = [release for page in pages for release in page if release.get("published_at") and not release.get("draft")]
          print(max(releases, key=lambda release: release["published_at"])["tag_name"] if releases else "")
          ')"
          fi
          if [ -z "$latest_upstream" ]; then
            echo "Could not determine the latest upstream release" >&2
            exit 1
          fi

          if [ "$current_upstream" = "$latest_upstream" ] && [ "${FORCE_BUILD:-false}" != true ]; then
            # 同步标记只代表源码基线；只有对应版本的完整发布存在时才跳过。
            published="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp | python3 - "$latest_upstream" 3<&0 <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import tomllib

          upstream = sys.argv[1].removeprefix("v").split("+", 1)[0]
          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          core, separator, prerelease = upstream.partition("-")
          if separator:
              matches = re.fullmatch(re.escape(upstream) + r"\.fork\.\d+", version) is not None
          else:
              base = tuple(map(int, core.split(".")))
              parts = version.split(".")
              matches = len(parts) == 3 and all(part.isdigit() for part in parts)
              matches = matches and tuple(map(int, parts[:2])) == base[:2] and int(parts[2]) > base[2]
          with os.fdopen(3) as response:
              releases = [release for page in json.load(response) for release in page]
          required = {"jcode-windows-x86_64.exe", "jcode-windows-x86_64.zip"}
          published = any(
              release.get("tag_name") == "v" + version and release.get("published_at")
              and not release.get("draft") and required <= {
                  asset["name"] for asset in release.get("assets", [])
                  if asset.get("state") == "uploaded" and asset.get("size", 0) > 0
              }
              for release in releases
          )
          print("true" if matches and published else "false")
          PY
            )"
            if [ "$published" = true ]; then
              echo "Already published Windows assets for $latest_upstream"
              exit 0
            fi
            echo "Source already synchronized; building missing Windows release for $latest_upstream"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected_master="$(git rev-parse origin/master)"
          latest_ref="refs/upstream-tags/$latest_upstream"
          git fetch https://github.com/1jehuang/jcode.git "refs/tags/$latest_upstream:$latest_ref"

          # 发布标记不一定是 master 的实际基线；排除双方已共享的上游提交。
          rebase_base="$(git merge-base master "$latest_ref")"
          if ! git rebase --onto "$latest_ref" "$rebase_base" master; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf 'Cargo.lock\nCargo.toml')"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected rebase conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              git rebase --abort
              exit 1
            fi
            git checkout --ours -- Cargo.toml Cargo.lock
            git add Cargo.toml Cargo.lock
            GIT_EDITOR=true git rebase --continue
          fi

          release_tag="$(python3 - "$latest_upstream" <<'PY'
          import subprocess
          import sys

          upstream = sys.argv[1]
          semver = upstream[1:] if upstream.startswith("v") else upstream
          # build metadata 也可能含 "-"，先剔除再判断 semver 预发布部分。
          core = semver.split("+", 1)[0]
          base, separator, prerelease = core.partition("-")

          def tag_exists(candidate):
              return subprocess.run(
                  ["git", "rev-parse", "--quiet", "--verify", f"refs/tags/{candidate}"],
                  stdout=subprocess.DEVNULL,
              ).returncode == 0

          if separator and prerelease:
              # 预览版保留上游预发布标识，只追加 fork 序号：
              # v1.0.0-preview.136 -> v1.0.0-preview.136.fork.1（已存在则 .fork.2 …）。
              stem = f"v{base}-{prerelease}"
              sequence = 0
              while True:
                  sequence += 1
                  candidate = f"{stem}.fork.{sequence}"
                  if not tag_exists(candidate):
                      print(candidate)
                      break
          else:
              parts = base.split(".")
              if len(parts) != 3:
                  raise SystemExit(f"Unsupported upstream version: {upstream}")
              major, minor, patch = map(int, parts)
              while True:
                  patch += 1
                  candidate = f"v{major}.{minor}.{patch}"
                  if not tag_exists(candidate):
                      print(candidate)
                      break
          PY
          )"
          release_version="${release_tag#v}"

          python3 - "$release_version" "$latest_upstream" <<'PY'
          from pathlib import Path
          import re
          import sys

          version, upstream = sys.argv[1:]
          cargo_toml = Path("Cargo.toml")
          text = cargo_toml.read_text(encoding="utf-8")
          text, count = re.subn(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not update Cargo.toml package version")
          cargo_toml.write_text(text, encoding="utf-8")

          cargo_lock = Path("Cargo.lock")
          text = cargo_lock.read_text(encoding="utf-8")
          pattern = r'(\[\[package\]\]\nname = "jcode"\nversion = ")[^"]+("\n)'
          text, count = re.subn(pattern, rf'\g<1>{version}\2', text, count=1)
          if count != 1:
              raise SystemExit("Could not update Cargo.lock package version")
          cargo_lock.write_text(text, encoding="utf-8")
          Path(".github/upstream-version").write_text(upstream + "\n", encoding="utf-8")
          PY

          git add Cargo.toml Cargo.lock .github/upstream-version
          git commit --amend --no-edit
          git tag -a "$release_tag" -m "发布 ${release_tag#v}"
          git push --atomic --force-with-lease="master:$expected_master" origin HEAD:master "refs/tags/$release_tag"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  windows-x64:
    name: Build Windows x64
    needs: sync-upstream
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || needs.sync-upstream.outputs.release_tag != '') }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      JCODE_CI: "1"
      JCODE_RELEASE_BUILD: "1"
      JCODE_CI_BUILD: "1"
      JCODE_BUILD_SEMVER: ${{ needs.sync-upstream.outputs.release_tag || github.ref_name }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # 上游默认包装器是 POSIX 脚本，原生 Windows runner 必须禁用。
      CARGO_BUILD_RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-upstream.outputs.release_tag || github.ref }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
          cache-all-crates: "true"

      - name: Build Windows release
        shell: pwsh
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Verify and package
        shell: pwsh
        run: |
          $binary = "target/x86_64-pc-windows-msvc/release/jcode.exe"
          & $binary --version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $binary dist/jcode-windows-x86_64.exe
          Compress-Archive -Path dist/jcode-windows-x86_64.exe -DestinationPath dist/jcode-windows-x86_64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcode-windows-x86_64
          path: |
            dist/jcode-windows-x86_64.exe
            dist/jcode-windows-x86_64.zip

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.sync-upstream.outputs.release_tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No release tag resolved for this run"
          }
          # semver 预发布判定：先去掉 build metadata（其中也可能含 "-"），
          # 再看核心版本之后是否仍有 "-"。
          $semver = ($tag -replace '^v', '').Split('+')[0]
          $prerelease = if ($semver.Contains('-')) { "true" } else { "false" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            # 预览版不会被 GitHub 选为 latest；正式版保持现有发布语义。
            gh release create $tag --draft --title $tag --generate-notes "--prerelease=$prerelease"
          }
          gh release upload $tag dist/jcode-windows-x86_64.exe dist/jcode-windows-x86_64.zip --clobber
          gh release edit $tag "--draft=false" "--prerelease=$prerelease"
